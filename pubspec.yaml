name: shellvibe
description: "ShellVibe — Cross-platform (iOS, Android, macOS, Windows, Linux) terminal, SSH/SFTP client and remote infrastructure workstation built with Flutter, dart_ssh2, xterm3 and Zero-Knowledge E2EE encryption."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.4.0+5

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # State management
  # Flutter's current flutter_test pins require the analyzer <13 generation line.
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.3

  # Navigation & Routing
  go_router: ^18.0.1

  # Terminal & SSH Engine
  # xterm3 continues the xterm2 fork and is published on pub.dev from 6.0.0 on,
  # so this tracks releases instead of a git ref. It is AGPL-3.0-or-later.
  # 6.1.0 is the first release carrying TerminalView.predictionText, which the
  # Mosh local-echo overlay draws through. 6.1.1 adds
  # TerminalView.commitComposing, which the mobile extra-key bar flushes the IME
  # through, and 6.1.2 adds Terminal.onReply, which Device Link needs to tell
  # the terminal's own replies apart from what the user typed. The floor is at
  # 6.3.0 because that release stops sizing every scrollback line to the window
  # width: at a 204-column grid holding 10000 lines, 60-column output retains
  # 24 MB less and 90-column output 20 MB less, which is memory a mobile
  # session keeps. 6.3.3 shrinks emoji to their two cells instead of clipping
  # their right edge, and 6.3.4 types numpad digits as text in agent CLIs that
  # ask for kitty's disambiguate flag only.
  xterm3: ^6.3.4
  # Back on the pub.dev release: every fix we carried on our fork landed
  # upstream by 4.0.1 (the transport, KEX, SFTP, web and HTTP work in #229,
  # #230 and #231), so there is nothing left for a pin to hold.
  # Everything at or above 3.1.0 is where the SSH stack's security work lives:
  # strict key exchange (`kex-strict-c-v00@openssh.com`) against Terrapin
  # (CVE-2023-48795), key generation on `Random.secure()`, correct NIST ECDH
  # scalar generation, peer public-value validation in every key exchange, and
  # a constant-time MAC comparison. 4.0.0 additionally drops the SHA-1 key
  # exchange methods, `ssh-rsa` host key signatures and the CBC ciphers from
  # the default proposals: a server offering nothing else now fails to
  # negotiate rather than connecting weakly, and has to be re-enabled through
  # `SSHAlgorithms` if we ever need to talk to one.
  dartssh2: ^4.0.1
  flutter_pty: ^0.4.2
  # Mosh UDP transport. Pinned to our fork by commit, not to the pub.dev
  # release: the package is at 0.0.x, so protocol fixes have to be able to land
  # here without waiting on upstream. Sync with upstream before bumping the ref.
  dart_mosh:
    git:
      url: https://github.com/klc/dart_mosh.git
      ref: 50d786564efcba115ebd4fe889ac3b867c17ec04
  # Network-change events, the roaming trigger for Mosh sessions.
  connectivity_plus: ^7.3.1

  # Device Link: LAN discovery and first-time QR pairing.
  nsd: ^5.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # Database & Storage
  drift: ^2.34.3
  flutter_secure_storage: ^11.0.0
  cryptography: ^2.9.0
  # Device Link self-signed X.509/CSR generation and PEM encoding.
  basic_utils: ^5.8.2
  local_auth: ^3.0.2

  # Desktop & Window Management
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3
  desktop_drop: ^0.8.0

  flutter_localizations:
    sdk: flutter

  # Utilities
  # Pinned to 0.20.2 by flutter_localizations in the current Flutter SDK.
  intl: ^0.20.2
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  shadcn_ui: ^0.56.0
  lucide_icons_flutter: ^3.1.15
  google_fonts: ^8.2.1
  file_selector: ^1.1.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  sqlite3: ^3.5.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

  # App icon generation. Run `dart run flutter_launcher_icons` after changing
  # assets/brand/icon.png or the flutter_launcher_icons block below.
  flutter_launcher_icons: ^0.14.4

  # Code generation
  # 2.16.x requires meta ^1.18.3, while flutter_test pins meta 1.18.0.
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  drift_dev: ^2.34.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The launcher artwork, bundled so the navigation rail can draw the same mark
  # the OS shows on the app icon.
  assets:
    - assets/brand/icon.png
    # System tray / menu bar icons, read at runtime by tray_manager.
    - assets/brand/tray_macos.png
    - assets/brand/tray.png
    - assets/brand/tray.ico

  # Interface face. Bundled rather than fetched at runtime: the whole shell is
  # set in it, and a first launch without a network must not fall back to the
  # platform font. Static instances cut from the variable original and subset to
  # Latin + Latin Extended-A (Turkish) plus the symbols the UI sets.
  # License in assets/fonts/ui/OFL.txt.
  fonts:
    - family: Inter Tight
      fonts:
        - asset: assets/fonts/ui/InterTight-Regular.ttf
          weight: 400
        - asset: assets/fonts/ui/InterTight-Medium.ttf
          weight: 500
        - asset: assets/fonts/ui/InterTight-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ui/InterTight-Bold.ttf
          weight: 700

    # Terminal Nerd Fonts (Mono variants — every glyph single-cell wide, which
    # keeps xterm3's grid alignment because xterm3 treats the Private Use Area
    # as width 1). Licenses in assets/fonts/nerd/LICENSES.txt.
    - family: JetBrainsMono Nerd Font Mono
      fonts:
        - asset: assets/fonts/nerd/JetBrainsMonoNerdFontMono-Regular.ttf
    - family: FiraCode Nerd Font Mono
      fonts:
        - asset: assets/fonts/nerd/FiraCodeNerdFontMono-Regular.ttf
    - family: MesloLGM Nerd Font Mono
      fonts:
        - asset: assets/fonts/nerd/MesloLGMNerdFontMono-Regular.ttf
    - family: Hack Nerd Font Mono
      fonts:
        - asset: assets/fonts/nerd/HackNerdFontMono-Regular.ttf
    - family: CaskaydiaCove Nerd Font Mono
      fonts:
        - asset: assets/fonts/nerd/CaskaydiaCoveNerdFontMono-Regular.ttf
    - family: UbuntuMono Nerd Font Mono
      fonts:
        - asset: assets/fonts/nerd/UbuntuMonoNerdFontMono-Regular.ttf
    - family: SauceCodePro Nerd Font Mono
      fonts:
        - asset: assets/fonts/nerd/SauceCodeProNerdFontMono-Regular.ttf
    - family: Symbols Nerd Font Mono
      fonts:
        - asset: assets/fonts/nerd/SymbolsNerdFontMono-Regular.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# App icons, generated by `dart run flutter_launcher_icons`.
#
# All three source files are drawn by tool/gen_app_icon.py from the mark's
# geometry — a monospace chevron and a block cursor, indigo on a dark plate —
# so change that script rather than the PNGs, then rerun it:
#   * icon.png — the master: a rounded plate inside ~10% padding, which is what
#     macOS and Windows want as-is.
#   * icon_ios.png — the plate at full bleed and flattened, because iOS applies
#     its own corner mask and rejects alpha.
#   * icon_android_foreground.png — the glyph alone inside the adaptive-icon
#     safe zone, drawn over adaptive_icon_background.
#
# The full ritual is three steps, because the 16px icons have to be redrawn as
# the cursor alone rather than downsampled:
#   python3 tool/gen_app_icon.py
#   dart run flutter_launcher_icons
#   python3 tool/gen_app_icon.py --patch-small
flutter_launcher_icons:
  image_path: "assets/brand/icon.png"

  android: true
  adaptive_icon_background: "#161926"
  adaptive_icon_foreground: "assets/brand/icon_android_foreground.png"

  ios: true
  image_path_ios: "assets/brand/icon_ios.png"
  remove_alpha_ios: true

  macos:
    generate: true
    image_path: "assets/brand/icon.png"

  windows:
    generate: true
    image_path: "assets/brand/icon.png"
    icon_size: 256

  web:
    generate: true
    image_path: "assets/brand/icon_ios.png"
    background_color: "#101220"
    theme_color: "#8B93FF"
