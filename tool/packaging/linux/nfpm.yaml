# nfpm manifest for the native Linux packages: .deb, .rpm and Arch .pkg.tar.zst
# from one description. Driven by tool/packaging/linux_packages.sh, which stages
# the files under ${SHELLVIBE_STAGE} (substituted by the script) and exports
# $SHELLVIBE_VERSION (expanded by nfpm).
#
# Runtime dependencies are the system libraries the Flutter bundle links against
# but does not carry: GTK 3 (Flutter's Linux embedder and most plugins),
# Ayatana AppIndicator (tray_manager), keybinder 3 (hotkey_manager) and
# libsecret (flutter_secure_storage). Each distribution names them differently,
# hence the overrides. The package-test job in release.yml installs every
# package on a clean image and fails on any unresolved library, so a wrong name
# here shows up before a release does.

name: shellvibe
arch: amd64
platform: linux
version: ${SHELLVIBE_VERSION}
version_schema: semver
release: 1
section: net
priority: optional
maintainer: ShellVibe <security@shellvibe.dev>
vendor: ShellVibe
homepage: https://shellvibe.dev
license: FSL-1.1-ALv2
description: |-
  Terminal, SSH and SFTP client
  Cross-platform terminal and SSH workstation with port forwarding, Mosh,
  an end-to-end encrypted vault and device sync.

contents:
  # The Flutter bundle is not relocatable piece by piece: the runner looks for
  # data/ and lib/ beside itself, so the whole bundle lives in one directory.
  - src: ${SHELLVIBE_STAGE}/opt/shellvibe
    dst: /opt/shellvibe
    type: tree

  - src: /opt/shellvibe/shellvibe
    dst: /usr/bin/shellvibe
    type: symlink
  - src: /opt/shellvibe/shellvibe-mcp
    dst: /usr/bin/shellvibe-mcp
    type: symlink

  - src: ${SHELLVIBE_STAGE}/usr/share
    dst: /usr/share
    type: tree

overrides:
  deb:
    depends:
      # Ubuntu 24.04 and Debian 13 renamed GTK for the 64-bit time_t transition.
      - libgtk-3-0t64 | libgtk-3-0
      - libayatana-appindicator3-1
      - libkeybinder-3.0-0
      - libsecret-1-0
  rpm:
    depends:
      - gtk3
      - libayatana-appindicator-gtk3
      - keybinder3
      - libsecret
  archlinux:
    depends:
      - gtk3
      - libayatana-appindicator
      - libkeybinder3
      - libsecret

rpm:
  summary: Terminal, SSH and SFTP client
  group: Applications/Internet
  compression: zstd

deb:
  compression: zstd

archlinux:
  packager: ShellVibe <security@shellvibe.dev>
