name: Mobile Release

# Builds the iOS and Android store bundles and, when asked, uploads them to
# App Store Connect (TestFlight) and a Google Play testing track.
#
# Manual only. A store upload spends a build number and, on Play, cannot be
# taken back, so it is never a side effect of pushing a tag. A run with
# `upload` off is a rehearsal: it signs and packages everything and keeps the
# bundles as workflow artifacts.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from pubspec.yaml without the build number
        required: true
        type: string
      platforms:
        description: Which stores to build for
        required: true
        default: both
        type: choice
        options:
          - both
          - ios
          - android
      upload:
        description: Upload to the stores (off = build and sign only)
        required: true
        default: false
        type: boolean
      play_track:
        description: Google Play track to upload to
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          package_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          build_number="$(sed -nE 's/^version:[[:space:]]*[^+[:space:]]+\+([0-9]+).*/\1/p' pubspec.yaml)"
          if [[ -z "$package_version" || -z "$build_number" ]]; then
            echo 'pubspec.yaml needs a version of the form X.Y.Z+BUILD.' >&2
            exit 1
          fi

          if [[ "$REQUESTED_VERSION" != "$package_version" ]]; then
            echo "Requested version $REQUESTED_VERSION does not match pubspec.yaml $package_version." >&2
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

  android:
    name: Android App Bundle
    needs: metadata
    if: inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require the upload key
        shell: bash
        run: |
          # Without it Gradle falls back to the debug key, which is fine for a
          # local `flutter run --release` and useless to Play.
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo 'ANDROID_KEYSTORE_BASE64 is not set; see docs/RELEASING.md.' >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Write the upload keystore
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"

      - name: Build the App Bundle
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # No --no-pub: `pub get` writes the plugin registrant for debug, with
        # dev dependencies (integration_test) in it, and only a build that
        # runs pub itself rewrites it for release without them.
        run: flutter build appbundle --release

      - name: Confirm the bundle carries the upload key
        shell: bash
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          signer="$(keytool -printcert -jarfile "$aab")"
          if grep -q 'CN=Android Debug' <<<"$signer"; then
            echo 'The bundle is signed with the debug key.' >&2
            exit 1
          fi
          grep -E '^(Owner|SHA256):' <<<"$signer"

      - name: Discard the upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: shellvibe-android-${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload to Google Play
        if: inputs.upload
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.shellvibe.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          # Draft until the app has been reviewed once: Play refuses a
          # completed release for an app that has never been published.
          status: draft
          whatsNewDirectory: distribution/whatsnew

  ios:
    name: iOS archive
    needs: metadata
    if: inputs.platforms != 'android'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Require the App Store Connect key
        shell: bash
        run: |
          # The key signs in to the developer account for automatic signing
          # and authenticates the upload; without it there is nothing to run.
          if [[ -z "$APPLE_API_KEY" ]]; then
            echo 'APPLE_API_KEY is not set; see docs/RELEASING.md.' >&2
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Import the Apple Distribution certificate
        # Optional. With an Admin key Xcode can use a cloud-managed distribution
        # certificate instead; with a narrower key it needs this one.
        if: env.IOS_DISTRIBUTION_P12 != ''
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          # Same ephemeral keychain as the desktop release: the runner is shared
          # infrastructure and the certificate must not outlive the job.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          cert="$RUNNER_TEMP/distribution.p12"
          echo "$IOS_DISTRIBUTION_P12" | base64 --decode > "$cert"
          security import "$cert" -k "$keychain" -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"

          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" $(security list-keychain -d user | tr -d '"')

      - name: Write the App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"

      - name: Archive
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # `flutter build ipa` cannot hand xcodebuild an API key, so Flutter
          # only writes the build configuration and xcodebuild does the rest.
          # The Dart compile still happens inside the archive, in Flutter's
          # own build phase.
          # No --no-pub, for the same plugin registrant reason as Android.
          flutter build ios --release --config-only
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Export, and upload when asked
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/ExportOptions.plist "$options"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$options"
          # `upload` sends the build straight to App Store Connect from the
          # export; `export` leaves an .ipa behind for a rehearsal.
          if [[ "$UPLOAD" == 'true' ]]; then
            /usr/libexec/PlistBuddy -c 'Set :destination upload' "$options"
          fi
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$options" \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

      - name: Discard the signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/asc.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: shellvibe-ios-${{ needs.metadata.outputs.version }}+${{ needs.metadata.outputs.build_number }}
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/Runner.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 30
