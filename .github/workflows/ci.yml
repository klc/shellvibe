name: CI

# Linux runs the whole suite on every pull request and push to main. macOS and
# Windows are the slow runners (the macOS test step alone took over eleven
# minutes), and all but a handful of tests are plain Dart that behaves the same
# on every OS, so a pull request only runs the tests tagged `platform` there.
# Their full suite runs weekly and on a manual run, and not at all on a push to
# main, whose pull request has already been through it.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    # Mondays 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the key so a push to main cannot cancel the weekly
  # full run on the same ref.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The action resolves a pull request's commit range through the API, so
      # the workflow-wide `contents: read` is not enough on its own.
      pull-requests: read
    steps:
      - name: Check out repository
        # Full depth so the action can resolve the range it scans, and so a
        # manual run scans everything rather than one commit.
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required since gitleaks-action v2 changed how it scans a pull
          # request: it reads the commit range from the API rather than from
          # the checkout, and without a token it refuses to start. The job
          # fails outright, so this cannot go unnoticed the way a misread
          # config could -- but it also means no scan ran.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Off, so the scanner never needs write access to a pull request.
          # A finding fails the job, which is the signal that matters; a
          # comment would buy nothing and would widen the token this workflow
          # runs with.
          GITLEAKS_ENABLE_COMMENTS: false
          # Required. The action does not pick up .gitleaks.toml from the
          # repository root on its own, and without this it runs the default
          # ruleset — which flags the fixtures the allowlist exists to permit
          # and, worse, reads as a passing scan on any push that happens not to
          # touch them. That is how this job stayed green while enforcing
          # nothing.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # Pinned so the scanner here and the one a developer runs are the
          # same program. They were not: the action installed 8.24.3, which
          # does not understand the `[[allowlists]]` array the config was first
          # written with, so it parsed the file, applied nothing, and failed on
          # fixtures that passed locally under a newer build.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  quality:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
          pub-cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: flutter test --reporter compact

      - name: Verify generated sources are current
        shell: bash
        run: |
          dart run build_runner build
          git diff --exit-code

  platform:
    name: ${{ matrix.name }}
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
          pub-cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Analysis does not depend on the host, so the Linux job's run covers it.
      - name: Test
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            flutter test --reporter compact --tags platform
          else
            flutter test --reporter compact
          fi
